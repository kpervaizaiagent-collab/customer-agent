<script>
  const WEBHOOK = "https://kpervaizaigent.app.n8n.cloud/webhook/d9f4052d-65d4-4c0a-ae1b-2bc523bsbadb2";

  const chat = document.getElementById('chat');
  const msg  = document.getElementById('msg');
  const send = document.getElementById('send');

  function addBubble(text, who='bot'){
    const div = document.createElement('div');
    div.className = `bubble ${who}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function ask(){
    const text = msg.value.trim();
    if(!text) return;
    addBubble(text,'user');
    msg.value=''; send.disabled=true;

    try{
      const res = await fetch(WEBHOOK, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: text })
      });
      const ct = res.headers.get('content-type') || '';
      let reply;
      if (ct.includes('application/json')) {
        const data = await res.json();
        reply = data.reply ?? JSON.stringify(data);
      } else {
        reply = await res.text();
      }
      addBubble(reply || 'No reply from server.');
    } catch (e) {
      console.error(e);
      addBubble('Request failed. Check webhook URL & CORS.');
    } finally {
      send.disabled=false;
      msg.focus();
    }
  }

  send.onclick = ask;
  msg.addEventListener('keydown', e => { if(e.key==='Enter') ask(); });
</script>
