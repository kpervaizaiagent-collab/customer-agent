<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Customer Service Agent</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;max-width:720px;margin:24px auto;padding:0 16px}
    h1{font-weight:650;margin:8px 0 16px}
    .chat{border:1px solid #ddd;border-radius:12px;padding:12px;height:60vh;overflow:auto;background:Canvas}
    .bubble{margin:8px 0;padding:10px 12px;border-radius:12px;max-width:75%;white-space:pre-wrap;word-wrap:break-word}
    .user{background:#e8f0ff;margin-left:auto}
    .bot{background:#f6f6f6}
    .row{display:flex;gap:8px;margin-top:12px}
    input{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px}
    button{padding:10px 14px;border:0;border-radius:8px;background:#1a73e8;color:white;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .hint{font-size:.9rem;color:#666;margin-top:8px}
  </style>
</head>
<body>
  <h1>Customer Service Agent</h1>
  <div id="chat" class="chat" aria-live="polite"></div>
  <div class="row">
    <input id="msg" placeholder="Type your question…" autocomplete="off" />
    <button id="send">Send</button>
  </div>
  <div class="hint">This page sends your message to an n8n Webhook and shows the JSON reply.</div>

  <script>
    const WEBHOOK = "https://kpervaizaiagent.app.n8n.cloud/webhook/d9f4052d-65d4-4c0a-ae1b-2bc523bbadb2"; // e.g. https://<subdomain>.hooks.n8n.cloud/customer-agent

    const chat = document.getElementById('chat');
    const msg  = document.getElementById('msg');
    const send = document.getElementById('send');

    function addBubble(text, who='bot'){
      const div = document.createElement('div');
      div.className = `bubble ${who}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function ask(){
      const text = msg.value.trim();
      if(!text) return;
      addBubble(text,'user');
      msg.value=''; send.disabled=true;

      try{
        const res = await fetch(WEBHOOK, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ message: text })
        });

        // Try JSON first, fall back to text if needed
        let data, replyText;
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) {
          data = await res.json();
          replyText = data.reply ?? JSON.stringify(data);
        } else {
          replyText = await res.text();
        }

        addBubble(replyText || 'No reply from server.');
      } catch (e) {
        console.error(e);
        addBubble('Sorry, request failed. Check your webhook URL and CORS.');
      } finally {
        send.disabled=false;
        msg.focus();
      }
    }

    send.onclick = ask;
    msg.addEventListener('keydown', e => { if(e.key==='Enter') ask(); });
  </script>
</body>
</html>
